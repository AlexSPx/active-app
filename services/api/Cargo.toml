[package]
name = "active-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.6", default-features = false, features = ["http1", "json", "tokio", "query"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server-graceful", "service", "tokio"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
subtle = "2.6.1"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "signal", "time", "sync", "io-util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = { version = "0.10.4", features = ["case-insensitive"] }
regex = "1.13.1"
jsonwebtoken = "9"
sha2 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.23.0"
tower = { version = "0.5.2", features = ["util"] }
