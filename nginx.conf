server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Expo Router Static Output Strategy
        # 1. Look for the file exactly as requested (assets, existing .html files)
        # 2. Look for the file with .html appended (handling clean URLs like /routines -> /routines.html)
        # 3. Look for directory index (if any)
        # 4. Fallback to index.html for client-side routing of dynamic routes
        try_files $uri.html $uri $uri/ /index.html;
    }

    # Cache Control for static assets (images, fonts, js, css)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public";
    }

    # Optional: Handle 404 explicitly if you want server-side 404s for non-SPA routes,
    # but for Expo Router, falling back to index.html is usually preferred for the "Not Found" route to render.
}
