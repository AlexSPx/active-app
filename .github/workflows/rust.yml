name: Rust API

on:
  push:
    branches: [master]
    paths: &rust-paths
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'package.json'
      - 'services/api/**'
      - 'contracts/**'
      - 'packages/api-client/**'
      - 'scripts/*contract*'
      - 'scripts/test-api-client.cjs'
      - 'yarn.lock'
      - '.github/workflows/rust.yml'
  pull_request:
    paths: *rust-paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - run: corepack enable && yarn install --frozen-lockfile
      - name: Contract generation and Rust fixtures
        run: yarn contract:check
      - name: Client typecheck
        run: yarn contract:typecheck
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Production build
        run: cargo build --workspace --release --locked
