name: Publish landing page

on:
  push:
    branches: [master]
    paths:
      - 'apps/site/**'
      - 'tools/exercise-model/**'
      - 'apps/client/lib/data/exercise-catalog.json'
      - 'apps/client/assets/exercise-animations.*'
      - 'apps/client/features/legal/**'
      - 'apps/client/public/privacy-policy.html'
      - 'scripts/sync-legal.py'
      - 'scripts/test_sync_legal.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'apps/site/**'
      - 'tools/exercise-model/**'
      - 'apps/client/lib/data/exercise-catalog.json'
      - 'apps/client/assets/exercise-animations.*'
      - 'apps/client/features/legal/**'
      - 'apps/client/public/privacy-policy.html'
      - 'scripts/sync-legal.py'
      - 'scripts/test_sync_legal.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.6.0
          package-manager-cache: false
      - name: Verify shared legal content
        run: |
          python3 scripts/test_sync_legal.py
          python3 scripts/sync-legal.py --check
      - name: Install exercise viewer dependencies
        run: npm ci --prefix tools/exercise-model
      - name: Check offline exercise demo
        run: python3 tools/exercise-model/build-offline.py --check
      - name: Build and verify static site
        run: bash apps/site/build.sh
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
