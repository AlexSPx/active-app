name: Publish landing page

on:
  push:
    branches: [master]
    paths:
      - 'landing/**'
      - 'features/legal/**'
      - 'public/privacy-policy.html'
      - 'scripts/sync-legal.py'
      - 'scripts/test_sync_legal.py'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'landing/**'
      - 'features/legal/**'
      - 'public/privacy-policy.html'
      - 'scripts/sync-legal.py'
      - 'scripts/test_sync_legal.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify shared legal content
        run: |
          python3 scripts/test_sync_legal.py
          python3 scripts/sync-legal.py --check
      - name: Prepare static site
        run: |
          mkdir _site
          cp landing/index.html landing/styles.css landing/script.js _site/
          cp -R landing/assets landing/legal _site/
      - name: Verify pages and local assets
        run: python3 landing/verify.py _site
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
